substitutions:
  _REGION: europe-west2
  _REPOSITORY: clipsubtitles
  _ENVIRONMENT: staging
  _BUILD_SERVICE_ACCOUNT_SUFFIX: staging
  _API_INTERNAL_URL: https://api.clipsubtitles.com
steps:
  - name: node:24-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends ffmpeg
        corepack enable
        corepack prepare pnpm@10.33.1 --activate
        pnpm install --frozen-lockfile
        pnpm --filter @clipsubtitles/web exec playwright install --with-deps chromium
        REQUIRE_CLEAN_GIT=1 pnpm release:gate
  - name: hashicorp/terraform:1.13.2
    entrypoint: sh
    args:
      - -ceu
      - |
        terraform -chdir=infra/terraform fmt -check
        terraform -chdir=infra/terraform init -backend=false
        terraform -chdir=infra/terraform validate
        terraform -chdir=infra/terraform test
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --platform=linux/amd64
      - --target=api
      - --build-arg
      - API_INTERNAL_URL=${_API_INTERNAL_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --platform=linux/amd64
      - --target=worker
      - --build-arg
      - API_INTERNAL_URL=${_API_INTERNAL_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/worker:$COMMIT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    secretEnv: ['NEXT_PUBLIC_GLEAP_SDK_TOKEN']
    args:
      - build
      - --platform=linux/amd64
      - --target=web
      - --secret
      - id=gleap_sdk_token,env=NEXT_PUBLIC_GLEAP_SDK_TOKEN
      - --build-arg
      - API_INTERNAL_URL=${_API_INTERNAL_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:$COMMIT_SHA
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/worker:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:$COMMIT_SHA
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/clipsubtitles-${_ENVIRONMENT}-gleap-sdk-token/versions/latest
      env: NEXT_PUBLIC_GLEAP_SDK_TOKEN
serviceAccount: projects/$PROJECT_ID/serviceAccounts/clipsubtitles-build-${_BUILD_SERVICE_ACCOUNT_SUFFIX}@$PROJECT_ID.iam.gserviceaccount.com
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
