<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  color-scheme:light dark;
  --bg:light-dark(#ffffff,#1c1c1e);
  --soft:light-dark(#f5f5f7,#242426);
  --soft-strong:light-dark(#e5e5ea,#3a3a3c);
  --line:light-dark(#d6d6db,#48484a);
  --ink:light-dark(#1d1d1f,#f5f5f7);
  --muted:light-dark(#6e6e73,#98989d);
  --accent:light-dark(#0071e3,#0a84ff);
  --accent-fill:light-dark(#0071e3,#0060df);
  --accent-ink:#ffffff;
  --ok:light-dark(#248a3d,#32d74b);
  --danger:light-dark(#d70015,#ff453a);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  font-feature-settings:"kern" 1,"liga" 1,"calt" 1;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font-size:14px;line-height:1.5}
button,input{font:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:24px;font-weight:650;line-height:1.18;letter-spacing:-.025em;text-wrap:balance}
.shell{width:100%;padding:16px}
.kind-start,.kind-approval,.kind-progress{max-width:720px;margin-inline:auto}
.kind-styles{max-width:980px;margin-inline:auto}
.card{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--bg)}
.kind-editor .card,.kind-styles .card{border:0;background:transparent}
.head{display:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em}
.mark{position:relative;width:32px;height:32px;flex:0 0 auto;border-radius:8px;background:var(--ink);color:transparent}
.mark:before,.mark:after{content:"";position:absolute;top:7px;width:12px;height:18px;border:4px solid}
.mark:before{left:6px;border-color:var(--bg) transparent var(--bg) var(--bg);border-radius:6px 0 0 6px}
.mark:after{right:5px;border-color:var(--accent) var(--accent) var(--accent) transparent;border-radius:0 6px 6px 0}
.mark b{display:none}
.body{padding:20px}
.kind-editor .body,.kind-styles .body{padding-inline:0}
.stack{display:grid;gap:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.eyebrow{margin-bottom:4px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--muted);font-size:11px;font-weight:550}
.btn{display:inline-flex;min-height:42px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);padding:0 18px;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:border-color .18s,background-color .18s,transform .12s}
.btn:hover{border-color:color-mix(in srgb,var(--ink),transparent 55%);background:var(--soft)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.style:focus-visible,.page:focus-visible,.word:focus-visible,input:focus-visible,.download:focus-visible{outline:3px solid color-mix(in srgb,var(--accent),transparent 48%);outline-offset:2px}
.btn.primary{border-color:var(--accent-fill);background:var(--accent-fill);color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent-fill),#fff 10%)}
.btn.danger{border-color:transparent;background:transparent;color:var(--danger)}
.btn:disabled{cursor:not-allowed;opacity:.48}
.dropzone{display:grid;min-height:160px;place-items:center;border:1px solid var(--line);border-radius:20px;background:var(--soft);padding:24px;text-align:center}
.drop-icon{display:grid;width:48px;height:48px;place-items:center;margin:0 auto 12px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:24px}
.styles{display:grid;grid-auto-columns:minmax(190px,1fr);grid-auto-flow:column;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.style{display:grid;gap:10px;min-width:190px;scroll-snap-align:start;border:1px solid var(--line);border-radius:20px;background:var(--bg);padding:8px;text-align:left;color:var(--ink);cursor:pointer;transition:border-color .18s,background-color .18s,transform .18s}
.style:hover{background:var(--soft)}
.style:active{transform:scale(.985)}
.style[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent),transparent 52%)}
.style-preview{position:relative;display:grid;aspect-ratio:16/9;place-items:center;overflow:hidden;border-radius:14px;background:#0a0a0a}
.style-preview video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;pointer-events:none}
.meta{display:grid}.approval-sheet{border-radius:18px;background:var(--soft);padding:8px 16px}
.kv{display:flex;justify-content:space-between;gap:24px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}.kv strong{font-variant-numeric:tabular-nums;text-align:right}
.notice{border-left:3px solid var(--line);padding:10px 12px;background:var(--soft);color:var(--muted);font-size:12px}
.stages{display:grid;gap:0}.stage{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;min-height:52px;align-items:start}
.stage:not(:last-child):after{content:"";position:absolute;left:9px;top:28px;bottom:0;width:1px;background:var(--line)}
.stage .circle{z-index:1;width:20px;height:20px;border:2px solid var(--line);border-radius:50%;background:var(--bg)}
.stage.done .circle{border-color:var(--ok);background:var(--ok)}
.stage.active .circle{border-color:var(--accent-fill);background:var(--accent-fill)}
.stage-detail{min-width:0}.stage-progress{height:5px;overflow:hidden;margin-top:9px;border-radius:3px;background:var(--line)}
.stage-progress i{display:block;height:100%;border-radius:inherit;background:var(--accent-fill);transition:width .3s}
.files{display:grid;gap:8px}.download{display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;border-radius:16px;background:var(--soft);padding:12px;color:var(--ink);text-decoration:none}
.editor{display:grid;grid-template-columns:minmax(0,1fr);gap:0;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--bg)}
.panel{min-width:0;border:0;border-right:1px solid var(--line);border-radius:0;background:var(--bg);padding:16px}
.panel:last-child{border-right:0}.pages{display:grid;gap:6px}
.page{width:100%;border:0;border-left:3px solid transparent;border-radius:14px;background:transparent;padding:10px 12px;text-align:left;color:var(--ink);cursor:pointer}
.page:hover{background:var(--soft)}.page.active{border-left-color:var(--accent);background:var(--soft)}
.stage-video{display:grid;min-height:320px;place-items:center;overflow:hidden;border-bottom:1px solid var(--line);background:#0a0a0a}
.stage-video video{width:100%;height:100%;max-height:520px;object-fit:contain}
.scene-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:10px 12px}.scene-nav .btn{min-height:36px;padding-inline:12px}.scene-label{min-width:0;text-align:center}.scene-label strong,.scene-label span{display:block}.scene-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pages-panel{display:none;border-bottom:1px solid var(--line)}.pages-panel.open{display:block}
.words{display:flex;flex-wrap:wrap;gap:7px}.word{border:1px solid transparent;border-radius:999px;background:var(--soft);padding:8px 12px;color:var(--ink);cursor:pointer}
.word:hover{background:var(--soft-strong)}
.word[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent),transparent 88%)}
.edit-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}.edit-row .btn{white-space:nowrap}
input{width:100%;height:42px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--ink);padding:0 14px}
.card,.dropzone,.style,.style-preview,.approval-sheet,.download,.editor,.page{corner-shape:squircle}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.error{color:var(--danger)}
@media(min-width:860px){.kind-editor .editor{grid-template-columns:minmax(360px,1.25fr) minmax(280px,.75fr)}.kind-editor .scene-nav,.kind-editor .pages-panel{grid-column:1/-1}.kind-editor .stage-video{border-right:1px solid var(--line);border-bottom:0}}
@media(max-width:720px){.shell{padding:8px}.body{padding:14px}.kind-editor .body,.kind-styles .body{padding-inline:8px}.styles{grid-auto-columns:82%;gap:14px;padding:2px 10px 10px 2px;scroll-padding-inline:2px 10px}.style{min-width:0;width:100%;scroll-snap-stop:always}.stage-video{min-height:300px}.panel{border-right:0}.row .btn{flex:1 1 auto}.edit-row{grid-template-columns:1fr 1fr}.edit-row input{grid-column:1/-1}.scene-label{max-width:46%}}

function enhanceDesign(){
  if(KIND==='start'){
    const selection=document.getElementById('selection');
    if(selection&&selection.textContent==='No video selected yet.'){
      selection.className='dropzone';
      selection.innerHTML='<div><span class="drop-icon">↑</span><strong>Choose a video to caption</strong><p class="muted" style="margin-top:4px">Upload a new clip or reuse one from your ChatGPT files.</p></div>';
    }

  if(KIND==='styles'){
    const descriptions={clean:'Clear and balanced',bold_pop:'High-energy social captions',lower_third:'Polished and understated',karaoke:'Follows every spoken word',minimal:'Quiet and editorial'};

function renderStart(){setStatus('Ready to begin');content.innerHTML='<div class="stack"><div><p class="eyebrow">Start with a video</p><h1>Caption a clip with your AI</h1><p class="muted" style="margin-top:8px">Choose a video, then tell ChatGPT how you want the captions to look.</p></div><div id="selection" class="notice">No video selected yet.</div><div class="row"><button id="choose" class="btn primary">Choose video</button><button id="library" class="btn">File library</button></div><input id="fallback" type="file" accept="video/*" hidden></div>';const choose=document.getElementById('choose'),library=document.getElementById('library'),fallback=document.getElementById('fallback');choose.onclick=function(){fallback.click()};fallback.onchange=async function(){const file=fallback.files&&fallback.files[0];if(!file)return;try{choose.disabled=true;choose.textContent='Uploading…';if(!(window.openai&&window.openai.uploadFile))throw new Error('Upload is not available in this host.');const uploaded=await window.openai.uploadFile(file,{library:true});await createFromFile({fileId:uploaded.fileId,fileName:file.name,mimeType:file.type})}catch(error){showError(error)}finally{choose.disabled=false;choose.textContent='Choose video'}};library.onclick=async function(){try{if(!(window.openai&&window.openai.selectFiles))throw new Error('The file library is not available in this host.');const files=await window.openai.selectFiles();if(files&&files[0])await createFromFile(files[0])}catch(error){showError(error)}}}
async function createFromFile(file){const selection=document.getElementById('selection');selection.textContent=(file.fileName||'Selected video')+' · preparing project…';const fetched=await window.openai.getFileDownloadUrl({fileId:file.fileId});const result=await callTool('create_caption_project',{title:(file.fileName||'Untitled video').replace(/\.[^.]+$/,''),file:{download_url:fetched.downloadUrl,file_id:file.fileId,mime_type:file.mimeType||'video/mp4',file_name:file.fileName||'video.mp4'}});const data=result.structuredContent||result;selection.innerHTML='<strong>'+esc(data.project&&data.project.title||'Video project created')+'</strong><br><span class="muted">Captions can start as soon as the import finishes.</span>';setStatus('Project created','var(--ok)');followUp('Continue captioning project '+(data.project&&data.project.id||'')+'. Poll the import if needed, then generate captions and show me the review UI.')}
function renderStyles(){const project=output.project||{};const presets=output.presets||[];currentVersion=project.version;setStatus('Review styles');content.innerHTML='<div class="stack"><div><p class="eyebrow">Choose a look</p><h1>'+esc(project.title||'Caption styles')+'</h1><p class="muted" style="margin-top:7px">Compare the animated text clearly, then preview your choice on your own video.</p></div><div class="styles" id="styles" aria-label="Caption styles"></div><div class="row between"><p id="style-note" class="muted" aria-live="polite">Current style: '+esc(project.style&&humanize(project.style.preset)||'Custom')+'</p><button id="preview-style" class="btn primary">Preview on my video</button></div></div>';const list=document.getElementById('styles');presets.forEach(function(preset){const id=preset.preset;const active=project.style&&project.style.preset===id;const button=document.createElement('button');button.className='style';button.setAttribute('aria-pressed',String(active));const preview=document.createElement('div');preview.className='style-preview';const media=document.createElement('video');media.src=WEB+'/marketing/style-previews/ui-'+encodeURIComponent(id)+'.mp4';media.poster=WEB+'/marketing/style-previews/ui-'+encodeURIComponent(id)+'.jpg';media.muted=true;media.loop=true;media.playsInline=true;media.preload=active?'metadata':'none';media.tabIndex=-1;preview.append(media);const label=document.createElement('strong');label.textContent=humanize(id);button.append(preview,label);if(active&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches)media.play().catch(function(){});button.onmouseenter=function(){if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)media.play().catch(function(){})};button.onmouseleave=function(){if(button.getAttribute('aria-pressed')!=='true'){media.pause();media.currentTime=0}};button.onclick=async function(){try{button.disabled=true;const result=await callTool('update_caption_project',{projectId:project.id,expectedVersion:currentVersion,ops:[{op:'set_preset',preset:id}]});const data=result.structuredContent||result;currentVersion=data.project.version;project.style=data.project.style;list.querySelectorAll('.style').forEach(function(item){item.setAttribute('aria-pressed','false');const video=item.querySelector('video');if(video){video.pause();video.currentTime=0}});button.setAttribute('aria-pressed','true');if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)media.play().catch(function(){});document.getElementById('style-note').textContent='Previewing '+humanize(id)}catch(error){showError(error)}finally{button.disabled=false}};list.appendChild(button)});document.getElementById('preview-style').onclick=function(){followUp('Render a free preview using the selected style for project '+project.id+'.')}}
function renderApproval(){const quote=output.quote||{};if(output.status==='render_started'){setStatus('Export started','var(--ok)');content.innerHTML='<div class="stack"><div><p class="eyebrow">Approved</p><h1>Your export is underway</h1><p class="muted" style="margin-top:8px">ClipSubtitles is preparing the files you approved.</p></div><button id="progress" class="btn primary">Show progress</button></div>';document.getElementById('progress').onclick=function(){followUp('Show live progress for task '+(output.task&&output.task.id||'')+'.')};return}setStatus('Approval required');content.innerHTML='<div class="stack"><div><p class="eyebrow">Review before export</p><h1>Everything is ready</h1></div><div class="meta"><div class="kv"><span class="muted">Files</span><strong>'+esc((quote.settings&&quote.settings.outputs||[]).map(humanize).join(' + '))+'</strong></div><div class="kv"><span class="muted">Resolution</span><strong>'+esc(quote.settings&&quote.settings.resolution)+'</strong></div><div class="kv"><span class="muted">Length</span><strong>'+esc(duration(quote.durationMs))+'</strong></div><div class="kv"><span class="muted">Total</span><strong>'+esc(quote.creditCost)+' credits</strong></div></div><div class="notice">Nothing is exported or charged until you approve this exact quote.</div><div class="row"><button id="approve" class="btn primary">Approve '+esc(quote.creditCost)+' credits & export</button><button id="change" class="btn">Change options</button></div></div>';document.getElementById('approve').onclick=async function(){const button=this;try{button.disabled=true;button.textContent='Starting export…';const result=await callTool('render_caption_export',{projectId:quote.projectId,approval:{quoteId:quote.id,approvedCreditCost:quote.creditCost},idempotencyKey:'widget:'+quote.id});render(result.structuredContent||result)}catch(error){showError(error)}finally{button.disabled=false}};document.getElementById('change').onclick=function(){followUp('I want to change the export options for project '+quote.projectId+'. Ask me which files and resolution I want, then create a new quote.')}}
let pollTimer=null;
function renderProgress(){
  const task=output.task||{};const exports=output.exports||[];const active=task.status==='queued'||task.status==='running';
  setStatus(active?'Working':humanize(task.status),active?'':task.status==='succeeded'?'var(--ok)':'var(--danger)');
  if(active){
    const preparing=task.progress<=5;const packaging=task.progress>80;
    content.innerHTML='<div class="stack"><div><p class="eyebrow">Creating your captions</p><h1>'+esc(stageLabel(task.stage,task.kind))+'</h1></div><div class="stages">'
      +'<div class="stage '+(preparing?'active':'done')+'"><span class="circle"></span><div class="stage-detail"><span>Preparing video</span>'+(preparing?'<div class="stage-progress"><i style="width:'+Math.max(10,task.progress*20)+'%"></i></div>':'')+'</div><span class="muted">'+(preparing?'Working':'Complete')+'</span></div>'
      +'<div class="stage '+(packaging?'done':'active')+'"><span class="circle"></span><div class="stage-detail"><span>Adding captions</span>'+(!packaging&&!preparing?'<div class="stage-progress"><i style="width:'+Math.max(2,task.progress)+'%"></i></div>':'')+'</div><span>'+esc(task.progress)+'%</span></div>'
      +'<div class="stage '+(packaging?'active':'')+'"><span class="circle"></span><div class="stage-detail"><span>Packaging files</span>'+(packaging?'<div class="stage-progress"><i style="width:'+Math.min(100,Math.max(8,(task.progress-80)*5))+'%"></i></div>':'')+'</div><span class="muted">'+(packaging?'Working':'Next')+'</span></div>'
      +'</div><div class="row between"><span class="muted">You can keep chatting while this finishes.</span><button id="cancel" class="btn danger">Cancel</button></div></div>';
    document.getElementById('cancel').onclick=async function(){const result=await callTool('cancel_caption_task',{taskId:task.id});render(result.structuredContent||result)};
    clearTimeout(pollTimer);pollTimer=setTimeout(async function(){try{const result=await callTool('get_caption_task',{taskId:task.id});render(result.structuredContent||result)}catch(error){showError(error)}},2200);return;
  }
  clearTimeout(pollTimer);
  if(task.status==='succeeded'){content.innerHTML='<div class="stack"><div><p class="eyebrow">Finished</p><h1>Your captioned video is ready</h1></div><div class="files" id="files"></div><div class="row"><button id="open-app" class="btn">Open in ClipSubtitles</button></div></div>';const list=document.getElementById('files');exports.forEach(function(file){const link=document.createElement('a');link.className='download';link.href=file.downloadUrl||'#';link.target='_blank';link.rel='noreferrer';link.innerHTML='<span><strong>'+esc(file.fileName)+'</strong><br><span class="muted">'+humanize(file.kind)+'</span></span><span>Download ↓</span>';list.appendChild(link)});document.getElementById('open-app').onclick=function(){openExternal(WEB+'/studio/'+(task.projectId||task.result&&task.result.projectId||''))};return}
  content.innerHTML='<div class="stack"><p class="eyebrow">'+esc(humanize(task.status))+'</p><h1>'+esc(task.error&&task.error.message||'This task did not finish.')+'</h1><button id="open-app" class="btn">Open ClipSubtitles</button></div>';document.getElementById('open-app').onclick=function(){openExternal(WEB+'/app')}
}
function renderEditor(){const project=output.project||{};const pages=project.pages||[];const words=project.transcript&&project.transcript.words||[];currentVersion=project.version;setStatus('Saved','var(--ok)');let pageIndex=0;content.innerHTML='<div class="row between" style="margin-bottom:12px"><div><p class="eyebrow">Edit captions</p><h1>'+esc(project.title||'Caption editor')+'</h1></div><button id="fullscreen" class="btn">Open fullscreen</button></div><div class="editor"><nav class="scene-nav" aria-label="Caption navigation"><button id="previous-page" class="btn" aria-label="Previous caption">← Previous</button><div class="scene-label"><strong id="scene-count">Caption 1 of '+esc(pages.length||1)+'</strong><span id="scene-text" class="muted">'+esc(pages[0]&&pages[0].text||'Current caption')+'</span></div><button id="next-page" class="btn" aria-label="Next caption">Next →</button></nav><section class="panel pages-panel" id="pages-panel"><div class="row between"><strong>All captions</strong><button id="close-pages" class="btn">Close</button></div><div id="pages" class="pages" style="margin-top:12px"></div></section><section id="video" class="stage-video"></section><section class="panel stack"><div><strong>Correct a word</strong><p class="muted">Select only the word that needs changing.</p></div><div id="words" class="words"></div><div id="edit" hidden><div class="edit-row"><input id="word-input" aria-label="Correct selected word"><button id="save-word" class="btn primary">Save correction</button><button id="cancel-word" class="btn">Cancel</button></div></div><div class="row between"><button id="all-scenes" class="btn">All captions</button><button id="styles-button" class="btn">Compare styles</button></div><p class="muted">Current style: <span id="current-style">'+esc(project.style&&humanize(project.style.preset))+'</span></p></section></div>';const pagesEl=document.getElementById('pages'),panel=document.getElementById('pages-panel'),count=document.getElementById('scene-count'),sceneText=document.getElementById('scene-text');function selectPage(index){pageIndex=Math.max(0,Math.min(Math.max(0,pages.length-1),index));count.textContent='Caption '+(pageIndex+1)+' of '+(pages.length||1);sceneText.textContent=pages[pageIndex]&&pages[pageIndex].text||'Current caption';pagesEl.querySelectorAll('.page').forEach(function(item,itemIndex){item.classList.toggle('active',itemIndex===pageIndex)});document.getElementById('previous-page').disabled=pageIndex<=0;document.getElementById('next-page').disabled=pageIndex>=pages.length-1}pages.slice(0,8).forEach(function(page,index){const button=document.createElement('button');button.className='page '+(index===0?'active':'');button.textContent=page.text;button.onclick=function(){selectPage(index);panel.classList.remove('open')};pagesEl.appendChild(button)});document.getElementById('previous-page').onclick=function(){selectPage(pageIndex-1)};document.getElementById('next-page').onclick=function(){selectPage(pageIndex+1)};document.getElementById('all-scenes').onclick=function(){panel.classList.add('open')};document.getElementById('close-pages').onclick=function(){panel.classList.remove('open')};selectPage(0);const video=document.getElementById('video');if(project.source&&project.source.playbackUrl){const player=document.createElement('video');player.src=project.source.playbackUrl;player.controls=true;player.playsInline=true;player.setAttribute('aria-label','Video with the current caption');video.appendChild(player)}else video.innerHTML='<span class="muted">Video preview unavailable</span>';const wordsEl=document.getElementById('words'),edit=document.getElementById('edit'),wordInput=document.getElementById('word-input');let selectedWord=null;words.slice(0,80).forEach(function(word){const button=document.createElement('button');button.className='word';button.textContent=word.text;button.setAttribute('aria-pressed','false');button.onclick=function(){selectedWord=word;wordsEl.querySelectorAll('.word').forEach(function(item){item.setAttribute('aria-pressed','false')});button.setAttribute('aria-pressed','true');wordInput.value=word.text;edit.hidden=false;wordInput.focus()};wordsEl.appendChild(button)});function closeEdit(){edit.hidden=true;selectedWord=null;wordsEl.querySelectorAll('.word').forEach(function(item){item.setAttribute('aria-pressed','false')})}document.getElementById('cancel-word').onclick=closeEdit;wordInput.onkeydown=function(event){if(event.key==='Enter')document.getElementById('save-word').click();if(event.key==='Escape')closeEdit()};document.getElementById('save-word').onclick=async function(){if(!selectedWord)return;try{const result=await callTool('update_caption_project',{projectId:project.id,expectedVersion:currentVersion,ops:[{op:'replace_word_text',wordId:selectedWord.id,text:wordInput.value}]});const data=result.structuredContent||result;currentVersion=data.project.version;render({project:data.project})}catch(error){showError(error)}};document.getElementById('styles-button').onclick=function(){followUp('Show the caption style comparison for project '+project.id+'.')};document.getElementById('fullscreen').onclick=async function(){if(window.openai&&window.openai.requestDisplayMode)await window.openai.requestDisplayMode({mode:'fullscreen'})}}
function humanize(value){return String(value||'').replace(/[-_]/g,' ').replace(/\b\w/g,function(ch){return ch.toUpperCase()})}function duration(ms){if(!Number.isFinite(ms))return '—';const seconds=Math.round(ms/1000);return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}function stageLabel(stage,kind){if(stage)return humanize(stage);if(kind==='generate_captions')return 'Listening for every word';if(kind==='render_preview')return 'Preparing your preview';return 'Creating your export'}function openExternal(href){if(window.openai&&window.openai.openExternal)window.openai.openExternal({href:href});else window.open(href,'_blank','noopener')}function showError(error){const message=error&&error.message?error.message:'Something went wrong.';content.insertAdjacentHTML('beforeend','<p class="error">'+esc(message)+'</p>');setStatus('Needs attention','var(--danger)');notifyHeight()}
window.addEventListener('message',function(event){if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=='2.0')return;if(message.id!==undefined&&pending.has(message.id)){const waiting=pending.get(message.id);pending.delete(message.id);if(message.error)waiting.reject(message.error);else waiting.resolve(message.result);return}if(message.method==='ui/notifications/tool-input')input=message.params;if(message.method==='ui/notifications/tool-result')render(message.params&&message.params.structuredContent)});render(output||{});
