<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#171614);--soft:light-dark(#f6f2ec,#211e1a);--line:light-dark(#ded8cf,#3b352e);--ink:light-dark(#17130f,#f7f0e7);--muted:light-dark(#685f56,#a79d92);--amber:#e98320;--amber-ink:#1d0d00;--ok:#4f8a3a;--danger:#b4473c;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--ink);font-size:14px;line-height:1.45}.shell{padding:14px}.card{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--bg)}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;font-weight:700}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:9px;background:#17130f;color:#fff}.mark b{color:var(--amber)}h1,h2,h3,p{margin:0}h1{font-family:Georgia,serif;font-size:25px;letter-spacing:-.035em}.body{padding:18px}.muted{color:var(--muted)}.eyebrow{color:var(--amber);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.stack{display:grid;gap:12px}.btn{display:inline-flex;min-height:40px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:0 15px;font:inherit;font-weight:650;cursor:pointer}.btn:hover{border-color:var(--amber)}.btn:active{transform:translateY(1px)}.btn.primary{border-color:var(--amber);background:var(--amber);color:var(--amber-ink)}.btn.danger{color:var(--danger)}.btn:disabled{cursor:not-allowed;opacity:.48}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.file{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center}.thumb{position:relative;display:grid;aspect-ratio:3/4;place-items:center;overflow:hidden;border-radius:12px;background:linear-gradient(145deg,#4f3928,#17130f);color:#fff;font-family:Georgia,serif;text-align:center}.thumb video{width:100%;height:100%;object-fit:cover}.meta{display:grid;gap:8px}.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}.styles{display:grid;grid-auto-columns:minmax(145px,1fr);grid-auto-flow:column;gap:10px;overflow-x:auto;padding-bottom:5px}.style{display:grid;gap:8px;min-width:145px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:9px;text-align:left;color:var(--ink);cursor:pointer}.style[aria-pressed=true]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}.style-preview{display:grid;aspect-ratio:4/3;place-items:end center;border-radius:8px;background:linear-gradient(145deg,#8b715a,#272019);padding:12px;color:white;font-weight:800;text-align:center;text-shadow:0 2px 5px black}.style-preview.bold-pop{font-size:19px;text-transform:uppercase;-webkit-text-stroke:1px #000}.style-preview.karaoke b{color:#ffd43b}.style-preview.minimal{font-weight:500}.progress{height:7px;overflow:hidden;border-radius:99px;background:var(--line)}.progress i{display:block;height:100%;border-radius:inherit;background:var(--amber);transition:width .3s}.stages{display:grid;gap:14px}.stage{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center}.stage .circle{width:18px;height:18px;border:2px solid var(--line);border-radius:50%}.stage.done .circle{border-color:var(--ok);background:var(--ok)}.stage.active .circle{border-color:var(--amber);box-shadow:inset 0 0 0 4px var(--bg);background:var(--amber)}.files{display:grid;gap:8px}.download{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);text-decoration:none}.editor{display:grid;grid-template-columns:minmax(170px,.65fr) minmax(260px,1.4fr) minmax(240px,.8fr);gap:12px;min-height:520px}.panel{border:1px solid var(--line);border-radius:13px;background:var(--bg);padding:14px}.pages{display:grid;gap:8px}.page{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:10px;text-align:left;color:var(--ink)}.page.active{border-color:var(--amber)}.stage-video{display:grid;min-height:430px;place-items:center;overflow:hidden;border-radius:13px;background:#090807}.stage-video video{width:100%;height:100%;max-height:540px;object-fit:contain}.words{display:flex;flex-wrap:wrap;gap:6px}.word{border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:5px 7px;color:var(--ink);cursor:pointer}.word:hover{border-color:var(--amber)}input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);padding:0 10px;font:inherit}.notice{border-left:3px solid var(--amber);padding:10px 12px;background:var(--soft);color:var(--muted);font-size:12px}.error{color:var(--danger)}@media(max-width:720px){.shell{padding:8px}.body{padding:14px}.file{grid-template-columns:66px 1fr}.editor{grid-template-columns:1fr;min-height:auto}.stage-video{min-height:380px}.editor .pages-panel{display:none}.styles{grid-auto-columns:minmax(130px,70%)}}
</style></head><body><main id="app" class="shell"><div class="card"><div class="head"><div class="brand"><span class="mark">C<b>S</b></span>ClipSubtitles</div><span id="state" class="pill">Loading…</span></div><div id="content" class="body"><p class="muted">Preparing the interface…</p></div></div></main>
<script>window.openai={toolOutput:{"ready":true},callTool:async function(name,args){return {structuredContent:window.openai.toolOutput}},sendFollowUpMessage:async function(){return {}},notifyIntrinsicHeight:function(){},requestDisplayMode:async function(){return {mode:'fullscreen'}},openExternal:function(){}};</script><script>
const KIND="start";const WEB="https://clipsubtitles.com";const content=document.getElementById('content');const state=document.getElementById('state');let output=window.openai&&window.openai.toolOutput?window.openai.toolOutput:null;let input=window.openai&&window.openai.toolInput?window.openai.toolInput:null;let currentVersion=null;let requestId=1;const pending=new Map();
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]})}
function request(method,params){const id=requestId++;window.parent.postMessage({jsonrpc:'2.0',id:id,method:method,params:params},'*');return new Promise(function(resolve,reject){pending.set(id,{resolve:resolve,reject:reject})})}
async function callTool(name,args){if(window.openai&&window.openai.callTool)return window.openai.callTool(name,args);return request('tools/call',{name:name,arguments:args})}
async function followUp(prompt){if(window.openai&&window.openai.sendFollowUpMessage)return window.openai.sendFollowUpMessage({prompt:prompt});return request('ui/message',{role:'user',content:[{type:'text',text:prompt}]})}
function notifyHeight(){requestAnimationFrame(function(){if(window.openai&&window.openai.notifyIntrinsicHeight)window.openai.notifyIntrinsicHeight({height:document.documentElement.scrollHeight})})}
function setStatus(label,tone){state.textContent=label;state.style.color=tone||''}
function render(next){output=next||output||{};if(KIND==='start')renderStart();if(KIND==='styles')renderStyles();if(KIND==='approval')renderApproval();if(KIND==='progress')renderProgress();if(KIND==='editor')renderEditor();notifyHeight()}
function renderStart(){setStatus('Ready to begin');content.innerHTML='<div class="stack"><div><p class="eyebrow">Start with a video</p><h1>Caption a clip with your AI</h1><p class="muted" style="margin-top:8px">Choose a video, then tell ChatGPT how you want the captions to look.</p></div><div id="selection" class="notice">No video selected yet.</div><div class="row"><button id="choose" class="btn primary">Choose video</button><button id="library" class="btn">File library</button></div><input id="fallback" type="file" accept="video/*" hidden></div>';const choose=document.getElementById('choose'),library=document.getElementById('library'),fallback=document.getElementById('fallback');choose.onclick=function(){fallback.click()};fallback.onchange=async function(){const file=fallback.files&&fallback.files[0];if(!file)return;try{choose.disabled=true;choose.textContent='Uploading…';if(!(window.openai&&window.openai.uploadFile))throw new Error('Upload is not available in this host.');const uploaded=await window.openai.uploadFile(file,{library:true});await createFromFile({fileId:uploaded.fileId,fileName:file.name,mimeType:file.type})}catch(error){showError(error)}finally{choose.disabled=false;choose.textContent='Choose video'}};library.onclick=async function(){try{if(!(window.openai&&window.openai.selectFiles))throw new Error('The file library is not available in this host.');const files=await window.openai.selectFiles();if(files&&files[0])await createFromFile(files[0])}catch(error){showError(error)}}}
async function createFromFile(file){const selection=document.getElementById('selection');selection.textContent=(file.fileName||'Selected video')+' · preparing project…';const fetched=await window.openai.getFileDownloadUrl({fileId:file.fileId});const result=await callTool('create_caption_project',{title:(file.fileName||'Untitled video').replace(/\.[^.]+$/,''),file:{download_url:fetched.downloadUrl,file_id:file.fileId,mime_type:file.mimeType||'video/mp4',file_name:file.fileName||'video.mp4'}});const data=result.structuredContent||result;selection.innerHTML='<strong>'+esc(data.project&&data.project.title||'Video project created')+'</strong><br><span class="muted">Captions can start as soon as the import finishes.</span>';setStatus('Project created','var(--ok)');followUp('Continue captioning project '+(data.project&&data.project.id||'')+'. Poll the import if needed, then generate captions and show me the review UI.')}
function renderStyles(){const project=output.project||{};const presets=output.presets||[];currentVersion=project.version;setStatus('Review styles');content.innerHTML='<div class="stack"><div><p class="eyebrow">Choose a look</p><h1>'+esc(project.title||'Caption styles')+'</h1><p class="muted" style="margin-top:7px">Pick a starting point. You can still change individual details afterward.</p></div><div class="styles" id="styles"></div><p id="style-note" class="muted">Current style: '+esc(project.style&&project.style.preset||'custom')+'</p></div>';const list=document.getElementById('styles');presets.slice(0,8).forEach(function(preset){const id=preset.preset;const button=document.createElement('button');button.className='style';button.setAttribute('aria-pressed',String(project.style&&project.style.preset===id));const preview=document.createElement('div');preview.className='style-preview '+id;preview.innerHTML=id==='karaoke'?'Caption <b>every word</b>':'Caption every word';const label=document.createElement('strong');label.textContent=humanize(id);button.append(preview,label);button.onclick=async function(){try{button.disabled=true;const result=await callTool('update_caption_project',{projectId:project.id,expectedVersion:currentVersion,ops:[{op:'set_preset',preset:id}]});const data=result.structuredContent||result;currentVersion=data.project.version;project.style=data.project.style;list.querySelectorAll('.style').forEach(function(item){item.setAttribute('aria-pressed','false')});button.setAttribute('aria-pressed','true');document.getElementById('style-note').textContent=humanize(id)+' is now applied. Ask ChatGPT to preview it when you are ready.';followUp('The user selected '+humanize(id)+'. Render a free preview for project '+project.id+'.')}catch(error){showError(error)}finally{button.disabled=false}};list.appendChild(button)})}
function renderApproval(){const quote=output.quote||{};if(output.status==='render_started'){setStatus('Export started','var(--ok)');content.innerHTML='<div class="stack"><div><p class="eyebrow">Approved</p><h1>Your export is underway</h1><p class="muted" style="margin-top:8px">ClipSubtitles is preparing the files you approved.</p></div><button id="progress" class="btn primary">Show progress</button></div>';document.getElementById('progress').onclick=function(){followUp('Show live progress for task '+(output.task&&output.task.id||'')+'.')};return}setStatus('Approval required','var(--amber)');content.innerHTML='<div class="stack"><div><p class="eyebrow">Review before export</p><h1>Everything is ready</h1></div><div class="meta"><div class="kv"><span class="muted">Files</span><strong>'+esc((quote.settings&&quote.settings.outputs||[]).map(humanize).join(' + '))+'</strong></div><div class="kv"><span class="muted">Resolution</span><strong>'+esc(quote.settings&&quote.settings.resolution)+'</strong></div><div class="kv"><span class="muted">Length</span><strong>'+esc(duration(quote.durationMs))+'</strong></div><div class="kv"><span class="muted">Total</span><strong style="color:var(--amber)">'+esc(quote.creditCost)+' credits</strong></div></div><div class="notice">Nothing is exported or charged until you approve this exact quote.</div><div class="row"><button id="approve" class="btn primary">Approve '+esc(quote.creditCost)+' credits & export</button><button id="change" class="btn">Change options</button></div></div>';document.getElementById('approve').onclick=async function(){const button=this;try{button.disabled=true;button.textContent='Starting export…';const result=await callTool('render_caption_export',{projectId:quote.projectId,approval:{quoteId:quote.id,approvedCreditCost:quote.creditCost},idempotencyKey:'widget:'+quote.id});render(result.structuredContent||result)}catch(error){showError(error)}finally{button.disabled=false}};document.getElementById('change').onclick=function(){followUp('I want to change the export options for project '+quote.projectId+'. Ask me which files and resolution I want, then create a new quote.')}}
let pollTimer=null;function renderProgress(){const task=output.task||{};const exports=output.exports||[];const active=task.status==='queued'||task.status==='running';setStatus(active?'Working':humanize(task.status),active?'var(--amber)':task.status==='succeeded'?'var(--ok)':'var(--danger)');if(active){content.innerHTML='<div class="stack"><div><p class="eyebrow">Creating your captions</p><h1>'+esc(stageLabel(task.stage,task.kind))+'</h1></div><div class="stages"><div class="stage '+(task.progress>5?'done':'active')+'"><span class="circle"></span><span>Preparing video</span><span class="muted">'+(task.progress>5?'Complete':'Working')+'</span></div><div class="stage '+(task.progress>80?'done':'active')+'"><span class="circle"></span><span>Adding captions</span><span>'+esc(task.progress)+'%</span></div><div class="stage"><span class="circle"></span><span>Packaging files</span><span class="muted">Next</span></div></div><div class="progress"><i style="width:'+Math.max(2,task.progress)+'%"></i></div><div class="row between"><span class="muted">You can keep chatting while this finishes.</span><button id="cancel" class="btn danger">Cancel</button></div></div>';document.getElementById('cancel').onclick=async function(){const result=await callTool('cancel_caption_task',{taskId:task.id});render(result.structuredContent||result)};clearTimeout(pollTimer);pollTimer=setTimeout(async function(){try{const result=await callTool('get_caption_task',{taskId:task.id});render(result.structuredContent||result)}catch(error){showError(error)}},2200);return}clearTimeout(pollTimer);if(task.status==='succeeded'){content.innerHTML='<div class="stack"><div><p class="eyebrow">Finished</p><h1>Your captioned video is ready</h1></div><div class="files" id="files"></div><div class="row"><button id="open-app" class="btn">Open in ClipSubtitles</button></div></div>';const list=document.getElementById('files');exports.forEach(function(file){const link=document.createElement('a');link.className='download';link.href=file.downloadUrl||'#';link.target='_blank';link.rel='noreferrer';link.innerHTML='<span><strong>'+esc(file.fileName)+'</strong><br><span class="muted">'+humanize(file.kind)+'</span></span><span>Download ↓</span>';list.appendChild(link)});document.getElementById('open-app').onclick=function(){openExternal(WEB+'/studio/'+(task.projectId||task.result&&task.result.projectId||''))};return}content.innerHTML='<div class="stack"><p class="eyebrow">'+esc(humanize(task.status))+'</p><h1>'+esc(task.error&&task.error.message||'This task did not finish.')+'</h1><button id="open-app" class="btn">Open ClipSubtitles</button></div>';document.getElementById('open-app').onclick=function(){openExternal(WEB+'/app')}}
function renderEditor(){const project=output.project||{};const pages=project.pages||[];const words=project.transcript&&project.transcript.words||[];currentVersion=project.version;setStatus('Saved','var(--ok)');content.innerHTML='<div class="row between" style="margin-bottom:12px"><div><p class="eyebrow">Focused editor</p><h1>'+esc(project.title||'Caption editor')+'</h1></div><button id="fullscreen" class="btn">Open fullscreen</button></div><div class="editor"><section class="panel pages-panel"><strong>Scenes</strong><div id="pages" class="pages" style="margin-top:12px"></div></section><section id="video" class="stage-video"></section><section class="panel stack"><div><strong>Words</strong><p class="muted">Select a word to correct it.</p></div><div id="words" class="words"></div><div id="edit" hidden><input id="word-input" aria-label="Correct word"><div class="row" style="margin-top:8px"><button id="save-word" class="btn primary">Save word</button><button id="cancel-word" class="btn">Cancel</button></div></div><div><strong>Look</strong><p class="muted">Current style: <span id="current-style">'+esc(project.style&&humanize(project.style.preset))+'</span></p></div><button id="styles-button" class="btn">Compare styles</button></section></div>';const pagesEl=document.getElementById('pages');pages.slice(0,8).forEach(function(page,index){const button=document.createElement('button');button.className='page '+(index===0?'active':'');button.textContent=page.text;button.onclick=function(){pagesEl.querySelectorAll('.page').forEach(function(item){item.classList.remove('active')});button.classList.add('active')};pagesEl.appendChild(button)});const video=document.getElementById('video');if(project.source&&project.source.playbackUrl){const player=document.createElement('video');player.src=project.source.playbackUrl;player.controls=true;player.playsInline=true;video.appendChild(player)}else video.innerHTML='<span class="muted">Video preview unavailable</span>';const wordsEl=document.getElementById('words'),edit=document.getElementById('edit'),wordInput=document.getElementById('word-input');let selectedWord=null;words.slice(0,80).forEach(function(word){const button=document.createElement('button');button.className='word';button.textContent=word.text;button.onclick=function(){selectedWord=word;wordInput.value=word.text;edit.hidden=false;wordInput.focus()};wordsEl.appendChild(button)});document.getElementById('cancel-word').onclick=function(){edit.hidden=true;selectedWord=null};document.getElementById('save-word').onclick=async function(){if(!selectedWord)return;try{const result=await callTool('update_caption_project',{projectId:project.id,expectedVersion:currentVersion,ops:[{op:'replace_word_text',wordId:selectedWord.id,text:wordInput.value}]});const data=result.structuredContent||result;currentVersion=data.project.version;render({project:data.project})}catch(error){showError(error)}};document.getElementById('styles-button').onclick=function(){followUp('Open the caption style picker for project '+project.id+'.')};document.getElementById('fullscreen').onclick=async function(){if(window.openai&&window.openai.requestDisplayMode)await window.openai.requestDisplayMode({mode:'fullscreen'})}}
function humanize(value){return String(value||'').replace(/[-_]/g,' ').replace(/\b\w/g,function(ch){return ch.toUpperCase()})}function duration(ms){if(!Number.isFinite(ms))return '—';const seconds=Math.round(ms/1000);return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}function stageLabel(stage,kind){if(stage)return humanize(stage);if(kind==='generate_captions')return 'Listening for every word';if(kind==='render_preview')return 'Preparing your preview';return 'Creating your export'}function openExternal(href){if(window.openai&&window.openai.openExternal)window.openai.openExternal({href:href});else window.open(href,'_blank','noopener')}function showError(error){const message=error&&error.message?error.message:'Something went wrong.';content.insertAdjacentHTML('beforeend','<p class="error">'+esc(message)+'</p>');setStatus('Needs attention','var(--danger)');notifyHeight()}
window.addEventListener('message',function(event){if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=='2.0')return;if(message.id!==undefined&&pending.has(message.id)){const waiting=pending.get(message.id);pending.delete(message.id);if(message.error)waiting.reject(message.error);else waiting.resolve(message.result);return}if(message.method==='ui/notifications/tool-input')input=message.params;if(message.method==='ui/notifications/tool-result')render(message.params&&message.params.structuredContent)});render(output||{});
</script></body></html>
