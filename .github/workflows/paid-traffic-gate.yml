name: Paid traffic gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: paid-traffic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clipsubtitles/web exec playwright install --with-deps chromium
      - name: Validate release proof rejection cases
        run: |
          python3 -B scripts/test_ci_release_proof.py
          python3 -B scripts/test_fast_release.py
      - name: Validate diagnostic redaction
        run: python3 -B scripts/test_ci_diagnostics.py
      - run: REQUIRE_CLEAN_GIT=1 pnpm release:gate
        env:
          AUTH_MODE: mock
      - name: Prepare sanitized browser failure diagnostics
        if: failure()
        env:
          AUTH_MODE: mock
        run: python3 -B scripts/collect-ci-diagnostics.py apps/web/e2e/.results apps/web/e2e/.results/ci-diagnostics
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/e2e/.results/ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.2
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform test

  release-proof:
    needs: [application, infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record the exact tested source tree
        run: python3 -B scripts/ci_release_proof.py --output release-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-proof.json
          if-no-files-found: error
          retention-days: 14
